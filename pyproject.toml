[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rustdl-py"
version = "0.1.0"
description = "Python wrapper for rustdl — Rust-native OWL 2 DL reasoner (zero Java, zero C bindings)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/alitrack/rustdl-py"
Repository = "https://github.com/alitrack/rustdl-py"
Issues = "https://github.com/alitrack/rustdl-py/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
